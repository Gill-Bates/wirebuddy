services:
  wirebuddy-node:
    image: giiibates/wirebuddy:latest
    container_name: wirebuddy-node
    restart: always
    stop_grace_period: 20s
    network_mode: host

    init: true
    pids_limit: 256
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN

    environment:
      SERVER_MODE: node
      WIREBUDDY_ENROLLMENT_TOKEN: "${WIREBUDDY_ENROLLMENT_TOKEN:?Set WIREBUDDY_ENROLLMENT_TOKEN in .env}"
      WIREBUDDY_ENROLLMENT_VERIFY_KEY: "${WIREBUDDY_ENROLLMENT_VERIFY_KEY:-}"
      WIREBUDDY_DATA_DIR: /app/data
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    security_opt:
      - no-new-privileges:true
    volumes:
      # Persistent data, including GeoLite2 databases in ./data/geolite2 (not tmpfs)
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "pgrep", "-f", "app.node.daemon"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s