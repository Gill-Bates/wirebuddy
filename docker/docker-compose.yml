services:
  wirebuddy:
    image: giiibates/wirebuddy:latest
    container_name: wirebuddy
    restart: always
    stop_grace_period: 20s
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      TZ: "${TZ:-Etc/UTC}"
      WIREBUDDY_SECRET_KEY: "${WIREBUDDY_SECRET_KEY:?Set WIREBUDDY_SECRET_KEY in .env}"
      WIREBUDDY_TRUST_PROXY_HEADERS: "${WIREBUDDY_TRUST_PROXY_HEADERS:-1}"
      WIREBUDDY_DATA_DIR: /app/data
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:${WIREBUDDY_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
