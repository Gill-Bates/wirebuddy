services:
  wirebuddy:
    image: giiibates/wirebuddy:latest
    container_name: wirebuddy
    restart: always
    stop_grace_period: 40s
    network_mode: host

    init: true
    pids_limit: 512
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - KILL
    security_opt:
      - no-new-privileges:true
      
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      WIREBUDDY_SECRET_KEY: "${WIREBUDDY_SECRET_KEY:?Set WIREBUDDY_SECRET_KEY in .env (head -c 32 /dev/urandom | base64)}"
      WIREBUDDY_TRUSTED_PROXIES: "${WIREBUDDY_TRUSTED_PROXIES:-127.0.0.1,::1}"
      WIREBUDDY_MTLS_PROXIES: "${WIREBUDDY_MTLS_PROXIES:-}"
      WIREBUDDY_HOST: "${WIREBUDDY_HOST:-}"
      WIREBUDDY_PORT: "${WIREBUDDY_PORT:-8000}"
      WIREBUDDY_PUBLIC_ORIGIN: "${WIREBUDDY_PUBLIC_ORIGIN:-}"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"


    volumes:
      # Persistent data, including GeoLite2 databases in ./data/geolite2 (not tmpfs)
      - ./data:/app/data
