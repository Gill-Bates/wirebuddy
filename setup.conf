# --- Build & Push Image ---
PROJECT="wirebuddy" && \
cd "/opt/${PROJECT}" && \
VERSION="$(tr -d '\r\n' < VERSION)" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
printf 'APP_VERSION=%s\nGIT_SHA=%s\nBUILD_DATE=%s\n' "$VERSION" "$GIT_SHA" "$BUILD_DATE" > BUILD_INFO && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  -f docker/Dockerfile \
  --build-arg APP_VERSION="$VERSION" \
  --build-arg GIT_SHA="$GIT_SHA" \
  --build-arg BUILD_DATE="$BUILD_DATE" \
  -t "docker.cirrio.de/${PROJECT}:latest" \
  --push .

# Local Build
cd /opt/wirebuddy

docker build \
  --pull \
  --target runtime \
  -t wirebuddy:local \
  -f docker/Dockerfile \
  .

# Local Run
docker run -d \
  --name wirebuddy-local \
  --network host \
  --cap-drop ALL \
  --cap-add NET_ADMIN \
  --security-opt no-new-privileges:true \
  --device /dev/net/tun:/dev/net/tun \
  -e WIREBUDDY_SECRET_KEY=local-dev-key \
  -v /opt/wirebuddy/data:/app/data \
  wirebuddy:local


docker compose down && docker compose pull && docker compose up -d

