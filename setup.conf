# --- Local Development Setup ---
PYTHON=python3.14  # requires-python >=3.14; no silent fallback to the system python3
command -v "$PYTHON" >/dev/null 2>&1 || { echo "python3.14 not found" >&2; return 1 2>/dev/null || exit 1; }
$PYTHON -m venv /opt/wirebuddy/.venv
source /opt/wirebuddy/.venv/bin/activate
pip install --upgrade pip
pip install -e "/opt/wirebuddy[dev]"

# --- Start Dev Server ---
export WIREBUDDY_SECRET_KEY="l+QGUq6BH9dLZkAQpG2jivXZeLLwYNMCmzUsfcD2wPM=" # Dummy Key - for DEV only!
export LOG_LEVEL="DEBUG"
cd /opt/wirebuddy && source .venv/bin/activate && python -m app.server

# --- Docker Login ---
docker login xxx
docker login  # Docker Hub

# --- Build & Push Image ---
export PYTHON_LIBRARIES_TOKEN="${PYTHON_LIBRARIES_TOKEN:-$(gh auth token)}" && : "${PYTHON_LIBRARIES_TOKEN:?no token: run gh auth login or export PYTHON_LIBRARIES_TOKEN}" && \
PROJECT="wirebuddy" && \
cd "/opt/${PROJECT}" && \
VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" && \
GIT_SHA="$(git rev-parse --verify HEAD)" && \
BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" && \
docker buildx build \
  --platform linux/amd64 \
  --pull \
  --target runtime \
  -f docker/Dockerfile \
  --build-arg "APP_VERSION=$VERSION" \
  --build-arg "VCS_REF=$GIT_SHA" \
  --build-arg "BUILD_DATE=$BUILD_DATE" \
  --secret id=python_libraries_token,env=PYTHON_LIBRARIES_TOKEN \
  --label "org.opencontainers.image.version=$VERSION" \
  --label "org.opencontainers.image.revision=$GIT_SHA" \
  --label "org.opencontainers.image.created=$BUILD_DATE" \
  -t "docker.cirrio.de/${PROJECT}:${VERSION}" \
  -t "docker.cirrio.de/${PROJECT}:latest" \
  --push \
  .

# Install Node
curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh | bash

# --- Full browsers ---
UX_TOOLS_DIR=/opt/ux-test-tools
mkdir -p "$UX_TOOLS_DIR" || exit
cd "$UX_TOOLS_DIR" || exit
[ -f package.json ] || npm init -y
npm install --save --no-package-lock playwright@latest @axe-core/playwright@latest
./node_modules/.bin/playwright install --with-deps chromium webkit firefox
# ./node_modules/.bin/playwright install --list
# ./node_modules/.bin/playwright uninstall --all

# --- ui-lint ---
cd /opt/wirebuddy/tools/ui-lint || exit
npm ci
npm run install:browsers

# --- Browser E2E (isolated instance) ---
cd /opt/wirebuddy || exit
UX_TOOLS_DIR=/opt/ux-test-tools
UX_ARTIFACT_DIR=$(mktemp -d /tmp/wb-ux-e2e.XXXXXX)
PLAYWRIGHT_DIR="$UX_TOOLS_DIR" PYTHON=/opt/wirebuddy/.venv/bin/python BROWSER=chromium \
  node tests/e2e/ui_lint_isolated.mjs "$UX_ARTIFACT_DIR"
PLAYWRIGHT_DIR="$UX_TOOLS_DIR" PYTHON=/opt/wirebuddy/.venv/bin/python BROWSER=chromium COLOR_SCHEME=light \
  node tests/e2e/live_resize.mjs "$UX_ARTIFACT_DIR"
PLAYWRIGHT_DIR="$UX_TOOLS_DIR" PYTHON=/opt/wirebuddy/.venv/bin/python BROWSER=webkit COLOR_SCHEME=light \
  node tests/e2e/ios_viewport_audit.mjs "$UX_ARTIFACT_DIR"

