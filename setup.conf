# --- Create Changelog ---
Vergleiche die Commits seit dem letzten Release-Tag (z. B. v1.6.0) mit dem aktuellen Feature-Branch und erstelle/aktualisiere die /opt/wirebuddy/CHANGELOG.md in englischer Sprache. Nutze dafür Commit-Messages und Code-Diff, um die Änderungen zu analysieren. Formuliere die Changelog kompakt und stichpunktartig - pro Punkt maximal 1-2 Sätze, nur das Wichtigste aus Sicht eines Endbenutzers.
Unterteile zwischen "New", "Fix" und "Security". "New" Punkte immer als Erstes auflisten. Fokussiere Dich ausschliesslich auf funktionale Änderungen; Design-Änderungen und rein interne Arbeit (Refactorings, Tests) werden weggelassen.

Prüfe, ob die Dokumentation sowie die beiden README-Dateien den aktuellen Stand entsprechen. Achte darauf, dass die Inhalte in englischer Sprache vorliegen.


# --- Squash Commit ---
Squash-merge all commits into main, create a new tag, tag it as v1.6.1, and push the tag. Use as commit Message "Release (x.xx)" (Replace x.xx by using the real Version Number).Then delete the feature branch locally and remotely.


