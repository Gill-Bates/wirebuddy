#
# actionlint validates runs-on against a label list baked into the binary. The
# Ubuntu 26.04 images went generally available for x64 and arm64 on 2026-09-17,
# which is newer than the list in released actionlint versions, so every job in
# this repository would be reported as an unknown runner label.
#
# These are GitHub-hosted labels, not self-hosted ones - this file only tells the
# linter they exist. Drop the entries once the pinned actionlint knows them.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
