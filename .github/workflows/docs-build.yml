name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      # The docs toolchain is installed from pyproject.toml's docs extra with
      # tools/pyproject-deps.py, so both decide what this workflow builds and
      # scans - a bump to either has to re-run it.
      - 'pyproject.toml'
      - 'tools/pyproject-deps.py'
      - '.github/workflows/docs-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'tools/pyproject-deps.py'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:
  # A release (docker-build.yml) can ship a version and changelog bump that
  # never touches docs/** on its own. CHANGELOG.md's push trigger above already
  # covers a plain commit, but a re-run of that workflow from an existing tag
  # would not re-fire this one otherwise. Rebuilding docs after every successful
  # release keeps the deployed site in step with what was actually published,
  # independent of which paths changed.
  workflow_run:
    workflows:
      - 'Docker Multi-Arch Build'
    types:
      - completed
  schedule:
    # Weekly re-scan: new CVEs in the docs dependencies would otherwise only
    # surface when something in the repo happens to change.
    - cron: '17 4 * * 1'

permissions:
  contents: read

# The weekly scan runs on the default branch like a deployment does, so it gets
# its own group: sharing one would let a starting scan cancel a running deploy.
# Only PR runs are cancellable; a deploy already underway is left to finish.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scan' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # workflow_run fires on every conclusion of "Docker Multi-Arch Build"
    # (success, failure, cancelled...). Only a successful release should trigger
    # a docs rebuild; every other trigger (push, pull_request,
    # workflow_dispatch, schedule) has no such conclusion to check.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # Named, as in ci.yml and docker-build.yml, and on 26.04 ahead of the
    # ubuntu-latest migration (actions/runner-images#14748). The docs toolchain
    # is installed from pyproject.toml onto a setup-python interpreter, so the
    # host only has to provide git for the revision-date plugin.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for git-based plugins
          # On workflow_run, GITHUB_SHA is the default branch's head, not the
          # commit the release published - so the default checkout would deploy
          # documentation for changes that are not in the release whenever main
          # moved on in the meantime. Empty for every other trigger, which
          # leaves checkout's own default in place.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # pyproject.toml is the single dependency manifest; the docs toolchain
      # lives in its [project.optional-dependencies] docs extra. Installing
      # `.[docs]` would also install the project itself and its runtime
      # dependencies, so only the extra is materialised here.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python3 tools/pyproject-deps.py docs > requirements-docs.txt
          cat requirements-docs.txt
          pip install --upgrade pip
          pip install -r requirements-docs.txt

      # The docs extra lists direct dependencies without versions, so what got
      # resolved is only known here. Scanning this very environment, in the job
      # that builds the site, keeps scan and build on one dependency set.
      # Trivy reports on what a manifest names, and the extra names only the
      # direct dependencies; the frozen list adds the transitive ones. The file
      # name has to contain "requirement" or Trivy's pip analyzer skips it.
      - name: Freeze the resolved docs environment
        run: pip freeze --all > docs-requirements-frozen.txt

      - name: Trivy scan docs dependencies
        # Pinned to an immutable commit SHA, see GHSA-69fq-xp46-6x23.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: 'false'
          scan-type: 'fs'
          scan-ref: 'docs-requirements-frozen.txt'
          # Trivy floats to the newest release on purpose; the action stays SHA-pinned.
          version: 'latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          # Dependency list only. No gate owns secret/misconfig scanning yet
          # (open gap, would be a Trivy fs job in ci.yml).
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'
          timeout: '5m'
          trivyignores: '.trivyignore'

      - name: Copy root files to docs
        run: |
          cp CHANGELOG.md docs/changelog.md
          cp LICENSE docs/license.md

      - name: Build documentation
        run: |
          mkdocs build -f docs/mkdocs.yml --strict

      # Runs against the same build that gets deployed. It used to live in a
      # separate job that rebuilt the docs from a shallow checkout, so the
      # git-revision-date plugin saw different history than the real build.
      # img.shields.io is excluded because the badges on the landing page and in
      # the README are generated on demand by a third party that throttles: a
      # badge answering 503 after lychee's retries says nothing about the
      # documentation, and blocking the Pages deploy on it only produces reruns.
      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --exclude 'fonts\.gstatic\.com'
            --exclude 'img\.shields\.io'
            --exclude 'gill-bates\.github\.io/wirebuddy'
            --exclude 'apps\.apple\.com'
            './site/**/*.html'
          fail: true

      - name: Upload artifact
        if: |
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            github.event_name == 'workflow_run'
          )
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    if: |
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_run'
      )
    needs:
      - build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
