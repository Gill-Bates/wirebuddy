#
# .github/workflows/docker-build.yml
# Copyright (C) 2026 Gill-Bates http://github.com/Gill-Bates
#
# Purpose: release on a v* tag - validate metadata, run the CI gate, build and
#   smoke-test both architectures, Trivy-scan, push the architecture images,
#   assemble a candidate index, verify and promote it to the version tag (and
#   `latest`), clean up and prune Docker Hub tags and publish the GitHub Release.
# Related: ci.yml (gate, called below), security.yml (weekly rescan of the
#   published image), docs-build.yml (rebuilds after a release);
#   .github/scripts/release_tags.py, toolchain_parity.py, release_notes.py,
#   release_publish.cjs; .github/workflows/AGENTS.md.
#
name: Docker Multi-Arch Build
run-name: docker-build-${{ github.ref_name }}-${{ github.run_number }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: docker-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io

jobs:
  # Release gate: the same checks the PR gate runs, on the tagged commit. The
  # main-ancestry check in meta only proves the commit is on main, not that CI
  # for it finished green - a tag pushed right after the merge could otherwise
  # start publishing while CI was still running.
  # Runs after meta, so a bad tag, version or secret fails within seconds instead
  # of after the full gate (cheap first).
  ci:
    name: CI gate
    needs: meta
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      # Read access to the private gillbates-* git dependencies.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  meta:
    name: Validate build metadata
    # Named, not ubuntu-latest: this job resolves the versions both
    # architectures are then built against, so a runner image that can differ
    # between two runs is exactly the kind of unannounced change the resolution
    # steps below exist to rule out.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Holds the Docker Hub credentials of the is_newest listing. Every job that
    # touches registry or release credentials references this environment, so a
    # deployment rule on it (tags v* only) guards all of them.
    environment: release
    permissions:
      contents: read
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
      apt_cache_date: ${{ steps.meta.outputs.apt_cache_date }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_newest: ${{ steps.newest.outputs.is_newest }}
      python_base: ${{ steps.rolling.outputs.python_base }}
      wireguard_tools_ref: ${{ steps.rolling.outputs.wireguard_tools_ref }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      arches: ${{ steps.matrix.outputs.arches }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history, so the main-ancestry check below can actually walk
          # from the tagged commit back to main.
          fetch-depth: 0

      # tomllib (stdlib) reads the version back out of pyproject.toml below and
      # the release scripts need 3.14; pinned so the runner's system Python
      # cannot drift out from under this job.
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Validate Docker Hub secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          : "${DOCKERHUB_USERNAME:?Missing DOCKERHUB_USERNAME secret}"
          : "${DOCKERHUB_TOKEN:?Missing DOCKERHUB_TOKEN secret}"

      - name: Validate and set build metadata
        id: meta
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          if ! echo "$DOCKERHUB_USERNAME" | grep -qE '^[a-z0-9][a-z0-9_-]{2,}$'; then
            echo "ERROR: Invalid Docker Hub username/namespace: '$DOCKERHUB_USERNAME'"
            exit 1
          fi

          if [ ! -f pyproject.toml ]; then
            echo "ERROR: pyproject.toml not found"
            exit 1
          fi

          # pyproject.toml [project] version is the single source of truth -
          # app/utils/version.py reads the same key at runtime.
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' | tr -d '[:space:]')"
          if [ -z "$VERSION" ]; then
            echo "ERROR: pyproject.toml has no [project] version"
            exit 1
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "ERROR: Invalid version format: '$VERSION' (expected: X.Y.Z or X.Y.Z-suffix)"
            exit 1
          fi

          # A release must always run from the v<VERSION> tag, so a manual run on
          # a branch cannot republish an existing version from a different commit
          # and move 'latest' with it. Re-runs are still possible: pick the tag
          # as the ref when dispatching manually.
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "ERROR: This workflow must run from a tag, but ref '${GITHUB_REF_NAME}' is a ${GITHUB_REF_TYPE}."
            echo "Push tag v${VERSION}, or re-run this workflow selecting that tag as the ref."
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "ERROR: Git tag (${GITHUB_REF_NAME}) does not match pyproject.toml version (${VERSION})"
            exit 1
          fi

          # The tag checks above only prove the name agrees with the manifest,
          # not that the commit underneath ever passed anything. A tag can be
          # pushed from any commit on any branch; without this, a v<VERSION> cut
          # from a stale or unreviewed commit publishes to Docker Hub.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not contained in main."
            echo "Merge the release commit into main first, then tag that commit."
            exit 1
          fi

          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          TAG="v${VERSION}"

          # Cache buster for the Dockerfile's apt layer (ARG APT_CACHE_DATE),
          # resolved once so both architectures key that layer on one value. A
          # date rather than BUILD_DATE's timestamp, so re-running the same
          # release within a day still restores the layer from cache.
          APT_CACHE_DATE="${BUILD_DATE%%T*}"

          {
            echo "apt_cache_date=${APT_CACHE_DATE}"
            echo "build_date=${BUILD_DATE}"
            echo "tag=${TAG}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

      # Everything the Dockerfile deliberately leaves rolling is resolved here,
      # once, and handed to every architecture as a build arg: the
      # python:3.14-slim tag and wireguard-tools' master branch. The two
      # architecture jobs reach those layers minutes apart, so each would
      # otherwise resolve "newest" on its own and could put different toolchains
      # in the two halves of one manifest.
      - name: Resolve rolling toolchain versions
        id: rolling
        run: |
          set -euo pipefail

          # The base image by digest, so both architectures build on the same
          # multi-arch index even if a new python:3.14-slim is pushed mid-run.
          python_base="python:3.14-slim"
          digest="$(docker buildx imagetools inspect "$python_base" \
            --format '{{.Manifest.Digest}}')"
          case "$digest" in
            sha256:*) ;;
            *) echo "ERROR: could not resolve a digest for ${python_base}"; exit 1 ;;
          esac
          python_base="python:3.14-slim@${digest}"

          # wireguard-tools master -> one commit SHA, compiled on both
          # architectures by docker/Dockerfile.
          wireguard_tools_ref="$(git ls-remote https://git.zx2c4.com/wireguard-tools.git refs/heads/master | cut -f1)"
          if [[ ! "$wireguard_tools_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: could not resolve wireguard-tools master (got '${wireguard_tools_ref}')"
            exit 1
          fi

          {
            echo "python_base=${python_base}"
            echo "wireguard_tools_ref=${wireguard_tools_ref}"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved once for every architecture:"
          echo "  python base      : ${python_base}"
          echo "  wireguard-tools  : ${wireguard_tools_ref}"

      # The only place architectures are declared. Both run on native runners -
      # no QEMU - because both compile wireguard-tools from source. Both runners
      # name an image rather than following ubuntu-latest; if the arm64 job
      # starts queueing for capacity, ubuntu-24.04-arm is the fallback.
      # release_tags.py checks the list against the architectures every release
      # must carry, and the candidate, parity and cleanup steps take their
      # expected architectures from this output, never from downloaded artifacts.
      - name: Declare build matrix
        id: matrix
        env:
          BUILD_MATRIX: >-
            {"include": [
            {"arch": "amd64", "runner": "ubuntu-26.04", "platform": "linux/amd64"},
            {"arch": "arm64", "runner": "ubuntu-26.04-arm", "platform": "linux/arm64"}
            ]}
        run: python3 .github/scripts/release_tags.py matrix

      # A release must not travel backwards: re-running an older tag would
      # otherwise move 'latest' onto the older image and let the pruning delete
      # the newer release, both irreversible on Docker Hub. Only the highest
      # version ever published (prereleases included) moves 'latest' or prunes.
      # This is a hint for the log and the build; promote and the pruning each
      # list Docker Hub again and decide on their own fresh listing. The listing
      # fails closed on anything but a first-page 404 (no repository yet).
      - name: Determine whether this is the newest release
        id: newest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: python3 .github/scripts/release_tags.py newest

  build:
    name: Build ${{ matrix.arch }} image
    needs: [meta, ci]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Holds the Docker Hub credentials of the base-image pull and the push.
    environment: release
    # No actions: write. The gha cache backend authenticates with the runner's
    # cache token (ACTIONS_RUNTIME_TOKEN), not with GITHUB_TOKEN.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE_NAME: ${{ format('{0}/wirebuddy', secrets.DOCKERHUB_USERNAME) }}
      # Matrix values reach run: bodies only through these variables.
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      TEST_IMAGE: ${{ format('wirebuddy:test-{0}', matrix.arch) }}
      CONTAINER_NAME: ${{ format('wirebuddy-test-{0}', matrix.arch) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          cache-binary: false

      # Logged in only for the authenticated base-image pull during the build and
      # again right before the push; the third-party Trivy action runs in
      # between with no registry credentials on the runner.
      - name: Log in to Docker Hub (build)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # PYTHON_BASE, WIREGUARD_TOOLS_REF and APT_CACHE_DATE are the rolling
      # inputs the meta job resolved once; passing them here keeps the two
      # architectures' toolchains and layer caches identical. The parity gate
      # in create-manifest checks that it worked. The gha cache is scoped per
      # arch and written only by this tag-triggered job, so no lower-trust run
      # (PR, branch) feeds the release cache. The private gillbates-* packages
      # are read through the BuildKit secret python_libraries_token, never a
      # build arg.
      - name: Build image for smoke tests
        env:
          PYTHON_BASE: ${{ needs.meta.outputs.python_base }}
          WIREGUARD_TOOLS_REF: ${{ needs.meta.outputs.wireguard_tools_ref }}
          APT_CACHE_DATE: ${{ needs.meta.outputs.apt_cache_date }}
          APP_VERSION: ${{ needs.meta.outputs.tag }}
          BUILD_DATE: ${{ needs.meta.outputs.build_date }}
          VCS_REF: ${{ github.sha }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          : "${RELEASE_TOKEN:?Missing RELEASE_TOKEN secret}"
          docker buildx build \
            --pull \
            --platform "$PLATFORM" \
            --target runtime \
            --load \
            --cache-from "type=gha,scope=${ARCH}" \
            --cache-to "type=gha,mode=max,scope=${ARCH}" \
            --secret id=python_libraries_token,env=RELEASE_TOKEN \
            --build-arg "PYTHON_BASE=${PYTHON_BASE}" \
            --build-arg "WIREGUARD_TOOLS_REF=${WIREGUARD_TOOLS_REF}" \
            --build-arg "APT_CACHE_DATE=${APT_CACHE_DATE}" \
            --build-arg "APP_VERSION=${APP_VERSION}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "VCS_REF=${VCS_REF}" \
            -t "$TEST_IMAGE" \
            -f docker/Dockerfile \
            .

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

      - name: Smoke test (Master mode)
        run: |
          set -euo pipefail

          # shellcheck disable=SC2317,SC2329  # invoked by the trap below, not inline (shellcheck >= 0.11 reports SC2329)
          cleanup() {
            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          }
          trap cleanup EXIT

          docker run -d --name "${CONTAINER_NAME}" \
            --platform "${PLATFORM}" \
            -e WIREBUDDY_SECRET_KEY="ci-smoke-test-key-not-for-production" \
            -e WIREBUDDY_SKIP_NETWORK_CHECK="1" \
            "${TEST_IMAGE}"

          echo "Waiting for in-container health endpoint..."
          for i in $(seq 1 45); do
            if ! docker ps -q -f name="${CONTAINER_NAME}" | grep -q .; then
              echo "✗ Container exited during startup after ${i}s"
              echo "=== Container logs ==="
              docker logs "${CONTAINER_NAME}" 2>&1 || echo "Could not retrieve logs"
              exit 1
            fi

            if docker exec "${CONTAINER_NAME}" \
                curl -fsS --max-time 2 "http://127.0.0.1:8000/api/system/status" > /dev/null 2>&1; then
              echo "✓ Master mode: in-container health check passed after ${i}s"
              exit 0
            fi

            sleep 1
          done

          echo "✗ Health check timeout after 45s"
          echo "=== Container logs ==="
          docker logs "${CONTAINER_NAME}" 2>&1 || echo "Could not retrieve logs"
          echo "=== Container status ==="
          docker ps -a -f name="${CONTAINER_NAME}"
          exit 1

      - name: Smoke test (Node mode)
        run: |
          set -euo pipefail

          echo "Testing node daemon module import..."
          docker run --rm --platform "${PLATFORM}" --entrypoint python "${TEST_IMAGE}" \
            -c "from app.node.daemon import run, main; print('✓ Node daemon module imports OK')"

          echo "Testing node mode startup (expecting graceful exit)..."
          EXIT_CODE=0
          LOGS=$(timeout 30s docker run --rm \
            --platform "${PLATFORM}" \
            -e SERVER_MODE=node \
            -e LOG_LEVEL=DEBUG \
            -e WIREBUDDY_SECRET_KEY="ci-node-test-key" \
            "${TEST_IMAGE}" 2>&1) || EXIT_CODE=$?

          if [ "$EXIT_CODE" -eq 1 ] && echo "$LOGS" | grep -Eq "ENROLLMENT_TOKEN|enrollment token"; then
            echo "✓ Node mode: Startup path OK (expected exit: missing enrollment token)"
          elif [ $EXIT_CODE -eq 124 ]; then
            echo "✗ Node mode: Timed out after 30s"
            echo "=== Logs ==="
            echo "$LOGS"
            exit 1
          else
            echo "✗ Node mode: Unexpected behavior"
            echo "=== Exit code: $EXIT_CODE (expected: 1) ==="
            echo "=== Logs ==="
            echo "$LOGS"
            exit 1
          fi

      # The evidence behind the parity gate in create-manifest. Read out of the
      # finished image rather than from the build args, so it reflects what was
      # actually installed - a stale cached layer would reuse an older toolchain
      # no build arg can reveal. bash overrides the entrypoint because
      # entrypoint.sh would otherwise boot the whole application.
      - name: Record toolchain versions (${{ matrix.arch }})
        run: |
          set -euo pipefail
          mkdir -p toolchain

          docker run --rm --platform "${PLATFORM}" \
            --entrypoint bash "${TEST_IMAGE}" -c '
              set -euo pipefail
              printf "python=%s\n" "$(python -c "import platform; print(platform.python_version())")"
              printf "wireguard_tools=%s\n" "$(wg --version | awk "{print \$2}")"
              printf "unbound=%s\n" "$(unbound -V 2>&1 | awk "/^Version/ {print \$2}")"
              printf "sqlite3=%s\n" "$(sqlite3 --version | awk "{print \$1}")"
              printf "iptables=%s\n" "$(iptables --version | awk "{print \$2}")"
              printf "openssl=%s\n" "$(openssl version | awk "{print \$2}")"
              printf "app_version=%s\n" "$(python -c "import tomllib; print(tomllib.load(open(\"/app/pyproject.toml\", \"rb\"))[\"project\"][\"version\"])")"
              printf "build_info=%s\n" "$(cat /app/BUILD_INFO)"
            ' > "toolchain/${ARCH}.txt"

          echo "--- ${ARCH} ---"
          cat "toolchain/${ARCH}.txt"

      # 30 days, so a rerun of a later job within GitHub's rerun window still
      # finds the build evidence.
      - name: Upload toolchain versions (${{ matrix.arch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-${{ matrix.arch }}
          path: toolchain/${{ matrix.arch }}.txt
          retention-days: 30
          if-no-files-found: error

      - name: Tag image for push
        run: docker tag "${TEST_IMAGE}" "${IMAGE_NAME}:${VERSION}-${ARCH}"

      - name: Trivy vulnerability scan
        id: trivy
        # Pinned to an immutable commit SHA, not a mutable ref. In March 2026
        # (GHSA-69fq-xp46-6x23) an attacker force-pushed 76 of 77 trivy-action
        # tags to a credential-stealing commit; this step runs between the two
        # Docker Hub logins, so a compromised action sees no credentials.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: 'false'
          image-ref: ${{ format('wirebuddy:test-{0}', matrix.arch) }}
          # No `version: latest`: the scanner is the release the pinned action ships
          # with, so a gate result is reproducible; Renovate bumps the action.
          # Lists every package, so a clean report still proves the scan read the image.
          list-all-pkgs: true
          format: 'json'
          output: 'trivy-${{ matrix.arch }}.json'
          exit-code: '1'
          ignore-unfixed: true
          # Vulnerabilities only; the source secret scan is the source-scan job in ci.yml.
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          timeout: '10m'
          trivyignores: '.trivyignore'

      # Scanner failure (no valid report, or no OS and Python package results)
      # and findings are separate verdicts: an unreadable report fails here
      # instead of passing as "0 findings". The scan step carries the blocking
      # exit code for findings.
      - name: Summarize Trivy report (${{ matrix.arch }})
        if: ${{ !cancelled() && steps.trivy.conclusion != 'skipped' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/trivy_report.py status "trivy-${ARCH}.json" \
            --expect-class os-pkgs --expect-class lang-pkgs \
            --expect-ref "wirebuddy:test-${ARCH}" \
            --summary-title "Trivy (${VERSION}, ${ARCH})" --list 20 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy findings (${{ matrix.arch }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-findings-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.json
          retention-days: 30
          if-no-files-found: warn

      - name: Log in to Docker Hub (push)
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The push output is kept: the digest Docker reports for this push is the
      # image the index is assembled from, so no later tag lookup can swap it.
      - name: Push arch-specific image
        run: |
          set -euo pipefail
          docker push "${IMAGE_NAME}:${VERSION}-${ARCH}" 2>&1 | tee "${RUNNER_TEMP}/push-${ARCH}.log"

      - name: Log out of Docker Hub (push)
        if: always()
        run: docker logout

      - name: Record image digest
        run: |
          set -euo pipefail
          PUSH_OUTPUT_FILE="${RUNNER_TEMP}/push-${ARCH}.log" DIGEST_FILE="digests/${ARCH}" \
            python3 .github/scripts/release_tags.py record-pushed-digest

      - name: Upload image digest (${{ matrix.arch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 30
          if-no-files-found: error

  # Candidate first: the index is pushed under a run-specific candidate tag and
  # read back from the registry, so no public tag moves before the index is
  # proven to describe exactly the build digests.
  create-manifest:
    name: Create and verify candidate index
    needs: [meta, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Holds the registry credentials of the candidate push.
    environment: release
    permissions:
      contents: read
    outputs:
      candidate: ${{ steps.candidate.outputs.candidate }}
      index_digest: ${{ steps.candidate.outputs.index_digest }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCHES: ${{ needs.meta.outputs.arches }}
      IMAGE_NAME: ${{ format('{0}/wirebuddy', secrets.DOCKERHUB_USERNAME) }}

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Download image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Download toolchain versions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: toolchain-*
          path: toolchain/
          merge-multiple: true

      # The release gate for "both images contain the same versions": exactly
      # the matrix architectures, every required field present, no difference.
      - name: Verify architectures carry identical versions
        run: python3 .github/scripts/toolchain_parity.py --dir toolchain --arches "$ARCHES"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          cache-binary: false

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag candidate-<version>-<run_id>-<run_attempt>; promote reuses this
      # output, so a rerun of promote alone verifies the same candidate.
      - name: Create and verify candidate index
        id: candidate
        env:
          DIGEST_DIR: digests
        run: python3 .github/scripts/release_tags.py create-candidate

      - name: Log out of Docker Hub
        if: always()
        run: docker logout

  # Re-reads the candidate, lists Docker Hub again and decides is_newest on that
  # fresh listing (the meta value is only a hint), then publishes the version tag
  # and - for the newest stable release only - `latest`, reading each back.
  # A rerun republishes its own version tag onto the newly verified candidate.
  promote:
    name: Promote candidate
    needs: [meta, create-manifest]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    outputs:
      is_newest: ${{ steps.promote.outputs.is_newest }}
      latest_moved: ${{ steps.promote.outputs.latest_moved }}

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Download image digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: image-digest-*
          path: digests/
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          cache-binary: false

      # The script logs in to Docker Hub itself (password on stdin) and logs out
      # on every outcome.
      - name: Promote verified candidate
        id: promote
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ format('{0}/wirebuddy', secrets.DOCKERHUB_USERNAME) }}
          VERSION: ${{ needs.meta.outputs.version }}
          ARCHES: ${{ needs.meta.outputs.arches }}
          CANDIDATE: ${{ needs.create-manifest.outputs.candidate }}
          INDEX_DIGEST: ${{ needs.create-manifest.outputs.index_digest }}
          META_IS_NEWEST: ${{ needs.meta.outputs.is_newest }}
          DIGEST_DIR: digests
        run: python3 .github/scripts/release_tags.py promote

  # Deliberately always(): the architecture tags are pushed by the build jobs,
  # but only a promoted index makes them redundant. If a later architecture,
  # the candidate or the promotion fails, the earlier tags are already on Docker
  # Hub with nothing left to remove them. This job deletes `<version>-<arch>`
  # for every matrix architecture on every outcome (absent is fine) and the
  # candidate tag only after a successful promote; otherwise the candidate stays
  # for a rerun and a later newest release's pruning removes it.
  cleanup-arch-tags:
    name: Remove architecture fragment tags
    needs: [meta, build, create-manifest, promote]
    # Without a version from meta nothing was pushed.
    if: always() && needs.meta.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Delete fragment tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          ARCHES: ${{ needs.meta.outputs.arches }}
          CANDIDATE: ${{ needs.create-manifest.outputs.candidate }}
          DELETE_CANDIDATE: ${{ needs.promote.result == 'success' }}
        run: python3 .github/scripts/release_tags.py cleanup-fragments

  # This is the destructive one: it deletes every published tag except the
  # current version and 'latest'. It runs only when promote's fresh listing
  # found this release to be the newest, and it lists again itself: a newer
  # release appearing in between makes it fail instead of deleting. Ordered
  # after the fragment cleanup so the two do not race on the same tags.
  cleanup-dockerhub-tags:
    name: Keep only latest and current version tag
    needs: [meta, promote, cleanup-arch-tags]
    if: >-
      needs.promote.result == 'success' &&
      needs.cleanup-arch-tags.result == 'success' &&
      needs.promote.outputs.is_newest == 'true'
    runs-on: ubuntu-26.04
    # Deletion is verified with polling loops, so cap the total runtime.
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Delete all non-current Docker Hub tags
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: python3 .github/scripts/release_tags.py prune

  create-release:
    name: Create GitHub Release
    needs: [meta, create-manifest, promote, cleanup-dockerhub-tags]
    # A promoted index is what a release documents. The pruning job is skipped
    # for an older re-run (see is_newest), and a skipped result must not
    # suppress the release for a version that really was republished - only an
    # outright pruning failure should.
    #
    # !cancelled() is what makes that work: without a status function in this
    # expression GitHub adds an implicit success() over every entry in needs,
    # and a skipped dependency does not satisfy it. always() would also do it,
    # but it would additionally publish a release out of a cancelled run.
    if: >-
      !cancelled() &&
      needs.promote.result == 'success' &&
      needs.cleanup-dockerhub-tags.result != 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The default GITHUB_TOKEN creates the release; docs-build.yml reacts to
    # this workflow through workflow_run, so no `release` event is needed.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCHES: ${{ needs.meta.outputs.arches }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Agent banner and job temp directory
        run: python3 .github/scripts/ci_job_setup.py

      - name: Download Trivy findings
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: trivy-findings-*
          path: trivy-reports/
          merge-multiple: false

      # A missing CHANGELOG section becomes a hint text; a missing or unproven
      # Trivy report fails the release.
      - name: Compose release notes
        env:
          IMAGE_NAME: ${{ format('{0}/wirebuddy', secrets.DOCKERHUB_USERNAME) }}
          INDEX_DIGEST: ${{ needs.create-manifest.outputs.index_digest }}
          LATEST_MOVED: ${{ needs.promote.outputs.latest_moved }}
        run: |
          set -euo pipefail
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          reports=()
          for arch in $ARCHES; do
            reports+=(--trivy-report "${arch}=trivy-reports/trivy-findings-${arch}/trivy-${arch}.json")
          done
          python3 .github/scripts/release_notes.py \
            --version "$VERSION" \
            --changelog CHANGELOG.md \
            --image "$IMAGE_NAME" \
            --index-digest "$INDEX_DIGEST" \
            --latest-moved "$LATEST_MOVED" \
            --run-url "${repo_url}/actions/runs/${GITHUB_RUN_ID}" \
            --asset-base "${repo_url}/releases/download/v${VERSION}" \
            --repo-url "$repo_url" \
            "${reports[@]}" \
            --output "${RUNNER_TEMP}/release-notes.md"

      # Draft first, reports attached and verified, then published. A rerun
      # republished :<version>, so an already published release whose notes
      # differ gets this run's body and reports. GitHub "Latest" follows the
      # Docker `latest` decision of `promote`.
      - name: Publish GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LATEST_MOVED: ${{ needs.promote.outputs.latest_moved }}
        with:
          script: |
            const path = require('node:path');
            const { publishRelease } = require('./.github/scripts/release_publish.cjs');
            const arches = process.env.ARCHES.split(/\s+/).filter(Boolean);
            await publishRelease({
              github,
              context,
              core,
              version: process.env.VERSION,
              releaseNotesFile: path.join(process.env.RUNNER_TEMP, 'release-notes.md'),
              assets: arches.map((arch) => ({
                name: `trivy-${arch}.json`,
                path: path.join('trivy-reports', `trivy-findings-${arch}`, `trivy-${arch}.json`),
              })),
              latestMoved: process.env.LATEST_MOVED === 'true',
            });
